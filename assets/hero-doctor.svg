<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-label="Illustration of a dentist in a white coat with a stethoscope">
  <defs>
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFE6FB"/>
      <stop offset="100%" stop-color="#E4D7F7"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1EEF6"/>
    </linearGradient>
  </defs>

  <!-- backdrop blob -->
  <path fill="url(#blob)" d="M240 30c96 0 176 40 200 118 22 70 -6 132 -46 176 -46 50 -104 82 -168 78 -70 -4 -138 -34 -172 -96 -32 -58 -30 -134 6 -190 40 -62 108 -86 180 -86z"/>

  <!-- stand shadow -->
  <ellipse cx="240" cy="524" rx="128" ry="18" fill="#D9CCEE" opacity="0.6"/>

  <!-- coat body -->
  <path d="M150 306 C150 262 185 234 240 234 C295 234 330 262 330 306 L344 512 L136 512 Z" fill="url(#coat)" stroke="#DCD2EC" stroke-width="2.5"/>

  <!-- v-neck -->
  <path d="M212 240 L240 300 L268 240" fill="none" stroke="#C9BEDD" stroke-width="3"/>
  <path d="M240 300 L240 340" fill="none" stroke="#C9BEDD" stroke-width="3"/>
  <!-- inner scrub -->
  <path d="M222 244 L240 296 L258 244 L258 340 L222 340 Z" fill="#2E2A38"/>

  <!-- lapel folds -->
  <path d="M196 258 L166 512" fill="none" stroke="#E3DCEF" stroke-width="3"/>
  <path d="M284 258 L314 512" fill="none" stroke="#E3DCEF" stroke-width="3"/>
  <!-- buttons -->
  <circle cx="240" cy="368" r="4.5" fill="#C9BEDD"/>
  <circle cx="240" cy="412" r="4.5" fill="#C9BEDD"/>
  <circle cx="240" cy="456" r="4.5" fill="#C9BEDD"/>
  <!-- neck -->
  <rect x="222" y="196" width="36" height="46" rx="14" fill="#E8B48C"/>

  <!-- stethoscope -->
  <path d="M178 270 C178 306 210 318 210 348 C210 370 192 382 178 382 C162 382 150 368 150 350"
        fill="none" stroke="#4A4458" stroke-width="7" stroke-linecap="round"/>
  <path d="M302 270 C302 306 270 318 270 348 C270 370 288 382 302 382 C318 382 330 368 330 350"
        fill="none" stroke="#4A4458" stroke-width="7" stroke-linecap="round"/>
  <circle cx="178" cy="390" r="10" fill="#4A4458"/>
  <circle cx="302" cy="390" r="10" fill="#4A4458"/>
  <circle cx="240" cy="350" r="14" fill="#4A4458"/>

  <!-- head -->
  <circle cx="240" cy="150" r="72" fill="#EFC29B"/>
  <!-- hair -->
  <path d="M168 140 C160 84 200 46 240 46 C284 46 320 82 312 140 C312 108 292 96 276 100 C264 84 216 84 204 100 C188 96 168 112 168 140Z" fill="#3B2A22"/>
  <path d="M170 132 C168 176 176 208 196 224 L188 158 Z" fill="#3B2A22"/>
  <path d="M310 132 C312 176 304 208 284 224 L292 158 Z" fill="#3B2A22"/>
  <!-- glasses -->
  <circle cx="212" cy="150" r="22" fill="none" stroke="#7C1FA2" stroke-width="4"/>
  <circle cx="268" cy="150" r="22" fill="none" stroke="#7C1FA2" stroke-width="4"/>
  <path d="M234 150 L246 150" stroke="#7C1FA2" stroke-width="4"/>
  <path d="M190 146 L172 140" stroke="#7C1FA2" stroke-width="4" stroke-linecap="round"/>
  <path d="M290 146 L308 140" stroke="#7C1FA2" stroke-width="4" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M214 182 Q240 202 266 182" fill="none" stroke="#8A4B32" stroke-width="4" stroke-linecap="round"/>
</svg>
